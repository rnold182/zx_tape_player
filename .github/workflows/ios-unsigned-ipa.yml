name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ios-ipa]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.lock requires Dart < 3.0, so stay on the last Dart 2 Flutter release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: |
          flutter --version
          xcodebuild -version

      - name: Download pub dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry zx_tape_player-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: zx_tape_player-unsigned-ipa
          path: build/ipa/zx_tape_player-unsigned.ipa
